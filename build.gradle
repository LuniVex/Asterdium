plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Minecraft 1.21.1 supplies LWJGL core; Vulkan bindings are a separate module.
    implementation("org.lwjgl:lwjgl-vulkan:${project.lwjgl_version}") { transitive = false }
    include("org.lwjgl:lwjgl-vulkan:${project.lwjgl_version}") { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.register('runMesherTests', JavaExec) {
    group = 'verification'
    description = 'Run deterministic chunk meshing tests without starting Minecraft.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.lunivex.asterdium.mesh.MesherSelfTest'
}

tasks.named('check') {
    dependsOn tasks.named('runMesherTests')
}
